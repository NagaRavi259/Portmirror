#!/usr/sbin/nft -f
#
# Port-mirroring gateway - BASE ruleset for the real Raspberry Pi.
#
# This is the STATIC half only: masquerade, forward hardening, and manager
# UI-port protection. The forwards themselves (DNAT rules) are dynamic - they
# live in table `ip pm`, created and updated live by the portmirror-manager
# service, and restored at boot by portmirror-base.service from
# /var/lib/portmirror/pm.nft (see portmirror-base.service).
#
# Table names are namespaced (pm_nat / pm_filter), NOT the generic "nat" /
# "filter" that Docker, ufw, and iptables-nft normally use on a real host -
# `nft list ruleset` on a typical Pi with Docker installed already shows a
# real `table ip nat` that this file must never touch or delete.
#
# BEFORE DEPLOYING, confirm and edit the two interface names below:
#   ip -br link      -> the real LAN_IF (eth0 / end0 ...) and VPN_IF (wg0 / tun0 ...)
# This file only matches on interfaces, not addresses or subnets - per-forward
# source scoping (which LAN clients may use a given forward) is handled by the
# manager itself (each forward's own allowed-sources set), not here. The
# equivalent LAN/VPN subnet settings live in /etc/portmirror/portmirror.env
# (PM_LAN_NET/PM_VPN_NET), which the app enforces independently (e.g. it
# rejects a forward target outside PM_VPN_NET) - a mismatch there doesn't
# affect this file, and vice versa.

define LAN_IF   = "eth0"                # <-- EDIT: confirm with `ip -br link`
define VPN_IF   = "wg0"                 # <-- EDIT: confirm with `ip -br link`
define UI_PORT  = 8088

# Idempotent reload: create-if-missing, delete, redefine. Never `flush ruleset` -
# that would also wipe Docker's/ufw's own tables on this host.
table ip pm_nat
delete table ip pm_nat
table inet pm_filter
delete table inet pm_filter

table ip pm_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Critical: without this, remote hosts have no route back to the LAN.
        oifname $VPN_IF counter masquerade
    }
}

table inet pm_filter {
    chain forward {
        type filter hook forward priority filter; policy accept;

        # LAN -> VPN is allowed only for flows the manager's DNAT rules created
        # (table `ip pm`, hook priority `filter - 1`, so it runs before this).
        # Don't write this as `ct status != dnat drop`: that compares the whole
        # status bitmask, and a DNAT'd flow here is DNAT|DNAT_DONE, so it would
        # drop every legitimate flow (this exact bug was caught by testing).
        iifname $LAN_IF oifname $VPN_IF ct status dnat accept
        iifname $LAN_IF oifname $VPN_IF ct state new counter drop
        # IPv6 is out of scope for this design: never forward it LAN <-> VPN
        iifname { $LAN_IF, $VPN_IF } oifname { $LAN_IF, $VPN_IF } meta nfproto ipv6 counter drop
    }

    chain input {
        type filter hook input priority filter; policy accept;

        # The manager's web UI/API must not be reachable from VPN-side hosts.
        iifname $VPN_IF tcp dport $UI_PORT counter drop
    }
}
