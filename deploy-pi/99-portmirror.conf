# /etc/sysctl.d/99-portmirror.conf
net.ipv4.ip_forward = 1
# loose reverse-path filtering (strict mode can drop valid return traffic)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# long-lived / bursty UDP services: raise if idle streams get cut off
# (defaults: 30s unreplied, 120s stream)
# net.netfilter.nf_conntrack_udp_timeout = 60
# net.netfilter.nf_conntrack_udp_timeout_stream = 300

# per-connection byte counters for the connection log (read by the manager; see diagnostics)
net.netfilter.nf_conntrack_acct = 1
