#!/usr/sbin/nft -f
#
# Port-mirroring gateway (container E / the "Local Pi") - BASE ruleset.
#
# Static part only: masquerade, forward hardening, manager-port protection.
# The forwards themselves (DNAT rules) live in table `ip pm`, owned by the
# portmirror manager (API/UI on :8088) and restored at boot from /state/pm.nft.
#
# Interface names are pinned in docker-compose.yml (interface_name:):
#   lan0 = local side (192.168.88.8)    vpn0 = VPN side (10.0.0.88)
# On the real Pi, set VPN_IF to the real tunnel interface (wg0 / tun0 / ...).

define LAN_NET  = 192.168.88.0/24
define VPN_NET  = 10.0.0.0/24
define LAN_IF   = "lan0"
define VPN_IF   = "vpn0"
define UI_PORT  = 8088
define DOCKER_HOST_VPN = 10.0.0.1

# Reload only our own tables (never `flush ruleset`: that would also wipe table ip pm).
table ip nat
delete table ip nat
table inet filter
delete table inet filter

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Critical: without this, backends have no route back to the LAN.
        oifname $VPN_IF counter masquerade
    }
}

table inet filter {
    # Only forward what a manager DNAT rule created (the DNAT rules carry the
    # per-forward source restrictions). inet family: IPv6 forwarding is dropped too.
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        iifname $LAN_IF oifname $VPN_IF ct status dnat accept
        counter comment "dropped: not a mapped LAN->VPN flow"
    }

    # The manager UI/API must not be reachable from the VPN-side hosts.
    chain input {
        type filter hook input priority filter; policy accept;

        tcp dport $UI_PORT ip saddr $VPN_NET ip saddr != $DOCKER_HOST_VPN counter drop
    }
}
