#!/usr/sbin/nft -f
#
# NEGATIVE CONTROL - deliberately broken. DNAT without masquerade.
# Used only by tests/orchestrator_tests.sh (PROOF-A) to reproduce the
# return-path failure from the design report. Never deploy this.

flush ruleset

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip saddr 192.168.88.0/24 tcp dport 80 counter dnat to 10.0.0.12:80
    }
}
